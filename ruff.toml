line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[lint.isort]
known-first-party = ["maya"]

[lint.flake8-bugbear]
# typer.Option/Argument in a default IS the Typer API — B008 is a false positive here.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
